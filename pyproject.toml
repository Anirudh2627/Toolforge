[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolforge"
version = "0.1.0"
description = "Execution-verified tool-use training and evaluation for small language models (SFT + GRPO)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Core package is intentionally stdlib + PyYAML so the environment, executor,
# verifier and benchmark run anywhere (including CPU-only CI and Colab).
# The training stack (torch/transformers/peft/trl) is added in Phase 3 as an
# extra with pinned, mutually compatible versions.
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Model-backed evaluation/inference. Lower bounds only: Qwen3 support requires
# transformers>=4.51.0. Mutually compatible PINNED versions (torch/transformers/
# peft/trl/bitsandbytes) are finalized in Phase 3 (requirements-train.txt) after
# checking against the actual Colab T4 stack — pinning blind would be guesswork.
hf = [
    "torch>=2.2",
    "transformers>=4.51.0",
    "peft>=0.15",
    "accelerate>=0.30",
]
# Optional MCP adapter (core never imports it).
mcp = ["mcp>=2.0"]
# Ablation plots and reports (Phase 5).
report = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
