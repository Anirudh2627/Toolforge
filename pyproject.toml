[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolforge"
version = "0.1.0"
description = "Execution-verified tool-use training and evaluation for small language models (SFT + GRPO)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Core package is intentionally stdlib + PyYAML so the environment, executor,
# verifier and benchmark run anywhere (including CPU-only CI and Colab).
# The training stack (torch/transformers/peft/trl) is added in Phase 3 as an
# extra with pinned, mutually compatible versions.
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
